docking_node:
  ros__parameters:
    # ── Camera / Timing ──
    # 自适应位姿时效窗口: 实际取 max(max_latency_ms, 实测检测间隔 × latency_interval_margin)。
    # 程序自动适应相机真实帧率 (6Hz→窗口~500ms, 30Hz→窗口~100ms 但受下限保护),
    # 走停模式下 6Hz 足够, 无需追求 30fps。
    camera.max_latency_ms: 150                # ms — 时效窗口下限 (高帧率时生效)
    camera.latency_interval_margin: 3.0       # 窗口 = 检测间隔 × 此值 (容忍 ~2 帧丢失)
    camera.expected_fps: 30
    # 相机光学中心相对底盘中心线的横向偏移 (+y, + = 相机偏左), 用于补偿
    # base→camera 静态 TF 的 mount.y 未含此偏移的情况: 不补的话量测 lat 会
    # 系统性偏小该值 → 节点认为"正对"时底盘中心实际在 tag 法线右该值处,
    # 停泊偏右、左腿撞桩。此值加回 raw_lat 后规划器在直行前触发横移修正
    # (量测驱动每停重测, 非一次性盲移 —— 盲移在 SEARCH 抖动重入会叠加)。
    #
    # 当前相机 (odin1 RTSP) 光心与底盘中心线齐平, 故为 0。3cm 那个值是为
    # **上一个相机**配的, 留在这里等于凭空注入一条假横偏 (raw_lat 被加大
    # 3cm → 节点以为底盘偏左 → 持续往右修 → 停泊系统性偏右 3cm)。
    # 换装偏心相机时按实测填。
    # 作用域: 只在单码路径生效 (_lookup_tag_pose 里 raw_lat 的唯一赋值点),
    # 双码路径完全不经过它。
    camera.lateral_offset_m: 0.0

    # ── Tag Identification ──
    tag.family: "36h11"
    tag.size: 0.15                            # m — tag edge length
    tag.frame: "tag36h11:0"                   # TF frame name
    tag.id: 0                                 # tag ID to dock to
    tag.fresh_timeout_sec: 2.0                # tag considered stale after N seconds (6fps + 转向盲区, 放宽避免误判 TAG_LOST)
    tag.tag_loss_timeout_sec: 2.5             # s — 接近中连续丢 tag 超此时长才回 SEARCH_TAG (检测流实测有 1.6~3s 空档, 1s 必抖动)
                                              #   仅单码路径退回 SEARCH_TAG; 双码路径到此直落 MOTION_FAILED, 不搜索不重试。
                                              #   且预算会被 dual.settle_sec(1.5s) 停稳窗结构性吃掉一截 (窗内每帧按设计拒收,
                                              #   计数器却照涨), 2.5s 实测只剩 ~0.93s 真实宽限 —— 比上面那个 1.6~3s 空档还短。
                                              #   失败串会把这笔账算出来 (见「墙码丢失 — 外层丢码看门狗预算耗尽」)。
    tag.ema_alpha: 0.5                        # EMA smoothing factor (0=heavier, 1=raw)
    tag.max_pose_jump_m: 0.3                  # reject single-frame jumps > N meters

    # ── TF Frames ──
    camera_frame: "camera_color_optical_frame"
    base_frame: "base_link"
    # measure_frame: empty = use base_frame; set to e.g. "base_footprint" for
    # direct base→tag TF (dist=tx.x, lat=tx.y). When empty, converts from
    # camera optical frame (dist=tz, lat=-tx).
    measure_frame: ""

    # ── Dock Target (final desired pose relative to tag) ──
    dock_target.distance: 0.55                # m — 底盘距 tag 停泊距离
    dock_target.lateral_offset: 0.0           # m — 0 = centered
    dock_target.yaw_offset_deg: 0.0           # degrees — yaw offset from facing tag

    # ── Base Type ──
    #   "diff_drive" — unicycle control (vx + wz only)
    #   "omni"       — full 3-DOF (vx, vy, wz) via cmd_vel
    #   "quadruped"  — SDK move(vx, vy, yaw_rate) callback
    # 机器狗 (ZSL-1) 是全向底盘, 用 omni: 横向偏差直接横移修正,
    # 经 l1w_control 的 /cmd_vel (vx/vy/wz) 下发。
    base.type: "omni"
    base.cmd_vel_topic: "cmd_vel"
    # 狗模式服务/状态话题前缀 (zsibot_l1_control, 节点名 l1w_control):
    # <prefix>/static_stand、<prefix>/stand_up、<prefix>/posture_state、
    # <prefix>/motion_enabled。备用桥 zsibot_bridge 无这些接口, 停用降级。
    base.l1w_prefix: "/l1w_control"

    # ── 静止站立 (posture) — 走停 × 呼吸抑制 ──
    # 每个停看点的"停"升级为完整闭环:
    #   停 → static_stand 锁定 (CMD_LOCK_MODE, 身体不喘)
    #      → 等 posture_state==static_stand 且距停稳 >= static_settle_sec
    #      → 解冻清旧位姿 → 等待 >= min_stable_frames 帧连续 accepted
    #      → 量测 + 重规划 (锁定下进行)
    #      → stand_up 恢复运动 → 等 motion_enabled==True → 起步
    # 锁定期间 cmd_vel 会被桥拒绝, 因此必须 stand_up 后才能走; DOCKED 保持
    # 锁定 (泊出自动先解锁); 取消/超时/失败终态自动恢复运动模式。
    posture.enable: false                     # 呼吸抑制总开关 (默认关) — 运行期可调: ros2 param set <节点> posture.enable true 即开 (也可 launch 传 posture_enable:=true); 无桥时也会自动降级停用
    posture.static_settle_sec: 1.2            # s — 停→量测最短间隔 (RTSP 延迟 + 锁定过渡 + 呼吸衰减; 与 turn_settle_sec 同起点取 max)
    posture.lock_ack_timeout_sec: 2.0         # s — 等 posture_state 确认; 超时本次停降级为未锁定继续
    posture.unlock_ack_timeout_sec: 2.0       # s — 等 motion_enabled==True (含固件退出 LOCK 滞后)
    posture.unlock_retries: 2                 # 次 — stand_up 重发上限, 耗尽 → MOTION_FAILED
    posture.min_stable_frames: 3              # 帧 — 规划前所需连续 accepted 新鲜帧 (1=关闭)
    posture.stable_frame_timeout_sec: 2.5     # s — 等不满 N 帧就带当前位姿规划 (防闪烁卡死)
    posture.service_wait_sec: 1.0             # s — 服务发现宽限, 超过后判定无桥并停用

    # ── 充电收尾 (charge) — DOCKED 后 静止(锁定)→阻尼 ──
    # 停泊成功后狗站在充电桩上方, 锁定后切阻尼泄力, 保持站立 (不趴下):
    #   static_stand (静止锁定) → passive (阻尼泄电机, 站立)
    # 与 posture.enable 完全无关: 呼吸抑制只管停-看循环的量测稳定,
    # 关闭它不影响收尾 — DOCKED 后照做。收尾完成后 cmd_vel 被桥门控
    # (锁定/阻尼态), 泊出 /start_undock 会自动 stand_up 恢复运动再盲退。
    charge.enable: true                       # 充电收尾总开关
    charge.passive: true                      # 阻尼(泄力)步开关 — 运行期可调 (锁定完成那一刻读参); false 时收尾止于锁定 (仅站立)
    charge.static_stand: false                # DOCKED 后先 static_stand 锁定再阻尼; false=跳过静止锁定, 直接阻尼 (passive, 站立泄力)
    charge.static_ack_timeout_sec: 3.0        # s — static_stand 等待确认
    charge.lie_down_settle_sec: 4.0           # s — (已弃用) 趴下动作时长, 当前流程不再使用 lie_down
    charge.passive_settle_sec: 2.0            # s — passive 服务受理后等待 (非硬件阻尼反馈)
    charge.retries: 1                         # 次 — 每步服务重试
    charge.service_wait_sec: 1.0              # s — 无桥宽限, 超时降级告警 (DOCKED 仍为成功)

    # ── Stop-and-Go Parameters ──
    stopgo.lateral_threshold: 0.05           # m — 左右横偏容许 ±5cm, 超过才转向对准
    stopgo.yaw_threshold_deg: 10.0           # deg — 角度容许 ±10°, 超过才转向
    stopgo.tune_angle: 0.0                   # rad — oblique correction (diff-drive), 0=disabled
    stopgo.jog_min: 0.05                     # m — minimum jog distance per step
    stopgo.jog_max: 0.20                     # m — maximum jog distance per step (运行期可调: launch 传 jog_max:=0.4 或 ros2 param set <节点> stopgo.jog_max; 0.15 太碎: 每次起停切换 4~6s 开销; 步长放大依赖 odom_scale 准确, VIO 下标定为 1.0)
    stopgo.jog_linear_rate: 0.08             # m/s — constant speed during forward jog
    stopgo.jog_angular_rate: 0.3             # rad/s — constant speed during turn
    # 必须 > l1w_control 的 min_angular_z 死区 (0.10), 同 lateral_rate 的道理。
    # 转向通道有两级减速会叠乘 (小角半速 × 近目标半速), 3° 转向会得到
    # 0.3×0.5×0.5 = 0.075 rad/s → 被 clampAxis 截成 0, 狗原地不动, 里程计只剩
    # 噪声, 反向看门狗立刻误判 "opposite commanded direction"。双码 yaw 步长
    # 上限只有 3°, 每个候选都落在这个区间, 故双码转向修正曾从未真正执行过。
    # 减速为的是削惯性冲量, 不是发不出去的指令 —— 掉到死区以下就抬回本值。
    stopgo.min_angular_rate: 0.12            # rad/s — 下发角速度下限 (死区保护)

    # ── 行进中航向保持 (只在双码纯直行区的那一步连续直行里武装) ────────
    # 区内一次走完剩余距离、不再走停, 于是"行程中新产生的 yaw 漂移"没有任何
    # 停看点能纠 —— 只能边走边守。残余航向 ε 的终点横向代价 = dock_distance
    # × sin ε: 现场实测的 5-10° 左偏 → 35-70mm, 而 dual.dock_tolerance 只有
    # 20mm; 夹进 ±2° 后降到 ~11mm。
    #
    # 为什么是"继电"(输出只有 0 或 ±rate) 而不是比例律: l1w_control 有
    # min_angular_z = 0.10 死区, |wz| < 0.10 被 clampAxis 直接截成 0。比例式
    # 命令在误差小的时候恰好落在死区里, 物理上发不出去 —— 不是调参能救的。
    #
    # 为什么参考量取 odom/IMU yaw 增量而不是墙码 bearing: ① 盲动期检测是冻结
    # 的, 行程中根本没有 bearing; ② 近场 bearing 带相机横向力臂增益 1+t_x/z,
    # 最不可信 —— 那正是区内禁离散转向的理由, 拿禁令的理由当参考量自相矛盾;
    # ③ bearing 把横偏和航向混在一起, 追它等于 pure pursuit 横向控制器;
    # ④ 这个底盘只有 IMU yaw 可信。
    #
    # 注意: 这没有推翻 _locked_bearing 的区内禁转向。那条禁的是"用近场视觉做
    # 离散大步开环转向"(单步 3°、增益 1.33、~2° 停止滞后); 这里做的是"用 IMU
    # 做连续微步闭环保持"(单周期 0.34°、增益恒为 1、20Hz 复算)。两条同时为真。
    stopgo.heading_hold_enable: true          # 现场一键回滚: ros2 param set 下一趟即生效
    # 唯一约束: > 死区 0.10。代码另有 max(rate, min_angular_rate) 结构性抬底,
    # 配进死区也不会静默失效。调大只会恶化单周期粒度 (0.3 → 0.86°/周期, 一个
    # 周期就跨掉 2/3 迟滞带)。
    stopgo.heading_hold_rate: 0.12            # rad/s — 接通时下发的角速度幅值
    # 门槛定在"残余航向的终点代价 < 停泊容差"这一点: 0.5×sin(2°) = 17.5mm
    # < dock_tolerance 20mm。同时需高于四足步态的机体摆动 (见 dual_feedback
    # 起步瞬态注释), 且 ≥ 一次最短接通能转的 1.03°。
    stopgo.heading_hold_engage_deg: 2.0       # 接通门槛
    # **绝不取 0**: 命令→odom 报告有 0.1-0.15s 滞后, 瞄 0 断开必过冲换符号 →
    # 抖振。迟滞带 1.3° > 最短接通粒度 1.03° (一次接通能穿过整条带),
    # 且 = 2× 噪声地板 3×odom_noise_rad(0.34°)。
    stopgo.heading_hold_release_deg: 0.7      # 断开门槛
    stopgo.heading_hold_min_engage_sec: 0.15  # 最短接通 (3 周期 ≈ 一个步态相位; 单周期脉冲底盘不一定响应)
    stopgo.heading_hold_cooldown_sec: 0.30    # 断开后冷却 — 让下一次决策基于已沉降的 odom
    # 不是安全边界 (那由"只降 |err|"的符号规则给, 与预算无关), 是"底盘不响应
    # wz / odom yaw 疯了"的诊断闸。正常一趟需 5-10°, 定低会静默把功能关掉 ——
    # 那是最坏的失效形态 (看起来在跑, 其实早就退回纯直行)。代码对此设了下限守卫:
    # budget 必须 > rate×min_engage_sec (按抬底后的 rate 算, 默认 0.12×0.15 =
    # 1.03°), 否则一次都接不通、used 恒 0, 日志与"没漂够门槛"逐字相同 —— 配低了
    # 会被 warn 掉并本趟退回纯直行, 不会假装开着。要真开就给到 3° 以上。
    stopgo.heading_hold_budget_deg: 15.0      # 单程累计下发角上限, 耗尽后告警 + 纯直行
    stopgo.turn_creep_linear: 0.0            # m/s — 已弃用: "边走边转"叠加前进会驶出目标横向范围; 固定纯原地转, 角度靠里程计校准 (此参数不再被读取, 保留仅为兼容)
    # 必须 > l1w_control 的 min_linear_y 死区 (0.10): 低于死区的横移指令会被
    # clampAxis 截成 0, 狗原地不动导致横移步判停卡死。取 0.12 留裕量。
    stopgo.lateral_rate: 0.12                # m/s — constant speed during lateral jog (omni)
    # 狗固件对横移通道的航位推算严重低估：实测 odom 记 0.507m、狗实际移约 2m
    # （低估 ~4 倍，前进/转向通道正常）。判停目标 = 距离/该系数，即狗真实
    # 位移达到目标时才判停。标定：跑 test_lateral_distance --distance 0.5，
    # 卷尺量实际位移 L，系数 = L / 报告中的横向位移。
    # 当前 1.0 = 未启用补偿（2026-09 确认: 当前设备/固件无需标定; 上面的
    # 低估数据仅旧设备, 标定方法留作换设备时参考）。走停每停重测重规划,
    # 尺度误差由量测闭环兜底, 不累积进终点位姿。
    stopgo.lateral_odom_scale: 1.0
    # 前进/后退通道同样低估（后退实测 odom 0.493m/实际 1m+，~2 倍；前进
    # 用户报告误差也很大，倍数待精标）。标定：跑
    # test_jog_distance --distance 0.3（前进）/ --distance -0.3（后退），
    # 卷尺量实际位移 L，系数 = L / 报告中的实际位移。
    # 当前 1.0 = 未启用补偿（2026-09 确认: 当前设备/固件无需标定, 同上）。
    stopgo.jog_odom_scale: 1.0
    stopgo.jog_backward_odom_scale: 1.0
    stopgo.turn_settle_sec: 1.5              # s — wait after turn for image to clear (加长: 避免模糊帧被 jump rejection 误拒)
    stopgo.turn_undershoot: 0.75             # fraction — turn only x% of commanded angle (仅 legacy full=False 路径; 走停/泊出盲转走 full=True 不经过此值)
    # 盲转停止滞后补偿 (scripts/test_turn_angle 同款两板斧): odom 判停到底盘
    # 真停之间隔着 控制周期(50ms)+/dog/odom 延迟+底盘减速惯性, 0.3rad/s 全速
    # 盲转实测每次多转 ~5-7° (对接日志: 目标 ±9.7° 实转 15-17°, 误差符号每步
    # 翻转 → 法线对准 2° 门槛永远进不去 → 原地摆头极限环, 横移分支触发不了)。
    stopgo.turn_lead_per_speed: 0.30         # rad/(rad/s) — 提前量: 剩余角 ≤ 此值×当前速率即提前发零速, 滑行补足剩余角 (由对接日志反推滞后 0.30-0.43s; 欠/过量恒定时微调本值)
    stopgo.turn_slow_rad: 0.14               # rad — 距目标此角度内减速到半速, 减小惯性冲量
    stopgo.max_turn_step: 0.17               # rad (~10°) — 单次转向硬上限, 小步转+每步重看, 低帧率下 tag 不易转出视野而丢失
    stopgo.small_turn_rad: 0.1               # rad — below this, turn at half speed
    stopgo.theta_shrink_ratio: 2.0           # dynamic bearing tolerance: max(yaw_threshold, dist/ratio)
    stopgo.drift_tol: 0.15                   # rad — bearing drift limit during jog

    # ── Final Servo (到位即 DOCKED) ──
    # stop-and-go 下规划器已把车停在目标距离 (plan_straight 距离到位即 [done]
    # 停车), 这里只做确认: 距离在 tolerance.position_m 内 + 方位 ≤ yaw_tol_deg
    # 即单帧判定 DOCKED —— 不再累积 1s 稳定(呼吸摆动凑不齐)也不查横向
    # (横向是方位 atan2(横向,距离) 的投影, 15° 已隐含 ≤ dist·tan15° ≈ 14cm)。
    final_servo.max_linear_speed: 0.05        # m/s — (legacy, not used in stop-and-go)
    final_servo.max_yaw_speed: 0.2            # rad/s — (legacy)
    final_servo.distance: 0.20                # m — enter FINAL_SERVO within this distance
    final_servo.yaw_tol_deg: 15.0             # deg — 到 dock_distance 即判定的方位门槛 (直行阶段不再追角度, 15° 内都接受)

    # ── Final Straight (两阶段停泊) ──
    # 阶段1(APPROACH) 按远/近分两级:
    #   远场 (dist > tighten_distance): 粗对准+前进。放宽方位/横向容忍 (far_*
    #     参数), 不做法线对准/横移 (normal=None → pure pursuit 一键瞄准前进)。
    #     1.5m 处 AprilTag normal 噪声 ±10° 被 dist 放大成 ±0.3m 横移噪声, 是
    #     远场反复/反向横移的根源 — 远场只进不平移, 先走进再精调。
    #   近场 (dist ≤ tighten_distance): 收紧到入口包络, 才做"先对齐法线再横移"
    #     → 直行。法线门槛不收紧 (normal 近场抖动 4~5°, 收紧会摆头)。跨区
    #     前进步长钳到恰好停在区界, 入口检查拿到最新鲜量测。
    # 阶段2(直行): 进入 start_distance 后无条件纯直行, 不再调角(像停车入库)。
    #   进入时做一次性失败检查(入口包络): 方位 > yaw_threshold_deg 或
    #   |横向| > entry_lateral_m 则对准过差、入库会撞偏 → 报失败走重试
    #   (倒车重锁)。直行阶段不修横向, 入口误差会一路带到终点, 故入口从严。
    final_straight.enable: true                       # 两阶段停泊开关; false 恢复单阶段
    final_straight.start_distance: 0.85               # m — 直行阶段起点 (须 > dock_target.distance)
    final_straight.yaw_threshold_deg: 3.0             # deg — 入口方位门槛: 进入直行距离时超此值报导航失败; 近场方位修正门槛同此值 (launch 默认 3.0 会覆盖)
    final_straight.normal_yaw_threshold_deg: 2.0      # deg — 近场法线(normal)对准门槛下限: 低于噪声, 实际生效门槛见 normal_turn_min_deg
    # 法线转向触发门槛 = max(normal_yaw_threshold_deg, 本值) (deg)。
    # normal 有平面 PnP 二义性 (mirror 解, 近场 ±10° 双峰: 实测解卷绕后在
    # ~170°/~190° 两簇间跳, 车体转 15° 读数几乎不变), 3帧 EMA 后残差仍 ±3-5°
    # → 2026-09 对接日志: 2° 门槛下原地摆头极限环, 横移永远触发不了。
    # 残差航向不查 normal, 由直行入口 (bearing+横向) 兜底, 容忍 final_servo 15°。
    final_straight.normal_turn_min_deg: 6.0
    final_straight.entry_lateral_m: 0.07              # m — 入口横向门槛: 进入直行距离时 |横向| 超此值报导航失败 (一次性入口检查)
    final_straight.lateral_threshold_m: 0.02          # m — 近场横移修正 / 捷径横向门槛: 比入口更紧。量测补偿加回相机 3cm 偏置后, 入口 0.03 的容差会把真实 0.03m 偏移放行直行 → 左腿撞桩; 近场修正与捷径改用此值 (须 < stopgo.lateral_threshold 保证规划器会滑)
    final_straight.tighten_distance: 1.3              # m — 远/近分界: dist ≤ 此值进入近场精调 (法线对准+横移+直行), > 则远场粗对准+纯前进 (建议 ≥ start_distance + jog_max)
    final_straight.far_yaw_threshold_deg: 15.0        # deg — 远场粗对准方位门槛: dist > tighten_distance 时方位 ≤ 此值即前进, 不做微调/横移 (远场 normal 不可靠不宜微调)
    final_straight.far_lateral_m: 0.20                # m — 远场粗对准横向门槛: dist > tighten_distance 时 |lat| ≤ 此值即前进; 远场只要求大方向对, 不消横向偏 (走到近场再说)

    # ── Dual optical stop/look docking (single-tag parameters above unchanged) ──
    # All distances below are optical z (not base x or Euclidean range).
    # Standing-only profile (crouch_enable: false): 1.8m standoff -> dual
    # corrections after every jog -> qualified near pile loss -> heading locked
    # -> straight run with wall-bearing micro-correction -> 0.50m parked,
    # then request passive. Crouch profile: dual.crouch_enable: true.
    dual.enable: false
    # 匍匐 profile 开关: false = 全程站立 (匍匐单轮转向每次附带 4.5~7cm 前移且
    # 小角度无法精确调整, 已放弃匍匐搜索/调整; 匍匐代码原样保留, 见 README 6.5b)。
    # true = 原匍匐流程 (站位 1.5m / near 1.0m / 30cm 主动锁定), 调参需整体回退
    # 本节站位类参数。
    dual.crouch_enable: false
    dual.wall_tag_size: 0.15
    dual.pile_tag_id: 51                       # must differ from tag.id
    dual.pile_tag_size: 0.05
    # 站位: 距墙码 1.70m (= observation_distance - tolerance) 处完成对准 → 直行。
    # 同时是 near 字段, 现在只剩两处用法: 排序校验 / yaw_cap 远近分档。
    # visible() 的桩码垂直离场放行与 approach 丢失闭锁 (站立下 locked 的唯一
    # 入口) 已改用直行包络 obs+tol = 1.90 —— 直行的提交发生在观察窗内任意处,
    # 拿窗下沿当放行门会在 1.70~1.90 造出"要先走一步才准走第一步"的死区。
    dual.straight_start_distance: 1.70
    dual.dock_distance: 0.50
    dual.align_tolerance_deg: 3.0              # each optical bearing, not their average
    dual.align_hold_sec: 0.5                   # same settled window, unique frames
    dual.pile_fresh_timeout_sec: 2.0           # deprecated; dual.fresh_sec now governs both tags
    dual.observation_distance: 1.8
    # 观察窗 obs±tol 同时是 observe 阶段的"站位守卫"门槛 (见 README 6.5b):
    # 墙码 z 一旦掉到下沿 (1.7m) 以下, 无论是否已对准, 先后退拉回再纠偏。
    # 缺这道门时距离只在"已对准且 held"之后才查, 而整场几乎都在纠偏 ——
    # 现场墙码 z 从 1.68 爬到 1.25 穿过整个窗口都无人察觉, 直到矮桩码被压出
    # 画面下沿、可见性包络破了才暴露。守卫只守近端 (太远无害)。
    dual.observation_tolerance: 0.1
    # 前进/后退步长。此前五处发出点都写死 min(.05, ...), 本节的值是装饰品
    # (reverse_step 早就调到 0.10 却从未生效); 硬上限已拆除, 现在真正生效。
    # 10cm: 1.8→0.5m 的 1.3m 由 26 步减半到 13 步 (每步起停+停稳+重测 ~2.9s,
    # 开销远大于位移本身)。精度不变 —— 终点步仍按剩余距离收缩, dock_tolerance
    # 仍是 0.02。可见性由 visible() 逐段采样保护 (jog_max 只闸单码规划器,
    # 对双码无 clamp, 双码真实上限就是本参数)。
    # 后退预算按距离守, 不按步数: reverse_limit 0.80m 不变 → 16 步自然降为
    # 8 步 (reverse_count 退化为不起作用的天花板), 站位账 1.00m → 10 步。
    dual.forward_step: 0.10
    dual.reverse_step: 0.10
    # 横移步长同理: 候选枚举原本写死 min(.03, lateral_step), 本行调到 0.05 在
    # 现场跑出来仍是 0.03。硬上限已拆除, 现在真正生效 (校验区间 [0.005, 0.10];
    # 单步盲走没有途中反馈, 上界取保守值, 防一步把两码推出画面)。
    dual.lateral_step: 0.05
    # 纯直行区上界: 墙码光学 z ≤ 此值后**禁横移**, 转向不再整体禁止而是交给
    # straight_yaw_lag_deg 的盈亏平衡门槛裁决 (等价于把 locked 的纯直行行为
    # 提前到这个距离; 见 _bearing_tol)。
    # 近场调方向确实越调越不准: 相机装在 base 前方 t_x 处, bearing 增益
    # 1+t_x/z 在 z=0.6 时已 1.33 (命令 2.86° 实变 3.30°), 而底盘停止滞后 ~2°
    # 与单步命令同量级。但 2026-09-12 现场证明"因此一律不转"是错的: 区内
    # bearing 一路涨到 11.22°、终点横偏 ~91mm。现在小误差仍不纠 (纠不过噪声),
    # 大误差纠, 贴近停泊点自动禁转。横移仍然整体禁止 —— 它没有对应的收益
    # 模型, 且近场来回横移正是 2026-09-11 那次失效的成因。
    # 未对准也只前进, 不判失败: 近场不做完整纠偏是取舍而非异常。
    # 区内动作形态: 一次连续直行走完剩余距离 (不再 10cm×N 次 jog), ActionWatch
    # 按实际行程放宽 deadline; 停稳重测收尾 —— 容差内即 done, 不足由收缩步
    # 补齐, 冲过则回退修剪 (负 jog, 显式日志), 里程计尺度误差由这个量测
    # 闭环兜底, 无需预先标定 jog_odom_scale。终局整段对桩码整体免检 (骑跨充电,
    # 到位时桩码在机体下方、必然出画); 若墙码在整段路径上会出画则退回逐步走。
    # 取值须 dock_distance < 本值 <= straight_start_distance (启动校验)。
    # **不要拿它当"关掉区内转向"的开关** —— 它同时管着上面那条"一次连续直行"
    # 与 visible() 的 allow_exit, 调低会把一次停到位一并关掉。要更保守地限制
    # 区内转向, 调 straight_yaw_lag_deg。
    dual.steering_stop_distance: 1.0
    # 单步转向上限按距离分两档 (原先写死 min(3°, yaw_step_deg), 配置是装饰):
    #   远场 (墙码光学 z > straight_start_distance) → yaw_step_deg
    #   近场 (z ≤ straight_start_distance)          → yaw_fine_step_deg
    # 3° 在近场合适, 在远场是灾难: 底盘停止滞后约 2°, 与命令同量级, 于是
    # turn_lead 的 0.5*target 钳位生效, 每步只转 target/2 ≈ 1.5° —— 现场
    # 20.4° 的方位偏差要 ~30 步 × 2.4s ≈ 70s, 顶着 observe_timeout_sec (90s)
    # 走, 必然失败。放到 8° 后滞后只占一小部分, 提前量按速率正常生效。
    # 放大上限不牺牲安全: visible() 会逐段采样整条转向轨迹, 会把 tag 甩出
    # 视野的大步直接否掉, 且 cap/2、cap/4 小候选一直在枚举里兜底。
    # 取值范围 [0.5, 15] deg, 且 fine ≤ coarse (启动时校验)。
    dual.yaw_step_deg: 8.0                     # deg — 远场粗步
    dual.yaw_fine_step_deg: 3.0                # deg — 近场细步
    # locked (直行阶段) 的墙码 bearing 微调: |bearing| > tol → 用 predict() 枚举
    # 打分的转向候选修正, ≤ tol → 纯前进。每停归零相机 bearing 即对墙码做 pure
    # pursuit, 横向误差按 0.5/1.3 ≈ 0.38 收缩到接触点 (见 README 6.5b)。
    # tol ∈ [0.5, align_tolerance_deg] (启动校验): locked 是最后的精修, 门槛比
    # 双码对准门还松就等于能撤销入口门; 下限以下是底盘转向分辨率。
    # max_turns = 连续转向预算 (任何前进清零) —— 兜住底盘 ~2° 停止滞后导致的
    # 预测与现实偏差, 超限后强制前进, 两条路径都不判失败。
    dual.straight_yaw_tol_deg: 1.5             # deg — 微调门槛 (小于它只直行)
    dual.straight_yaw_max_turns: 3             # x — 连续转向上限, 前进即清零
    # 纯直行区内 bearing 微调**不停摆**, 改用随接近收紧的盈亏平衡门槛
    # (_bearing_tol): tan|b| > dock_distance·sin(lag)/(z − dock_distance)。
    #   收益 = pure pursuit 把终点横偏收缩 y·(1 − dock_distance/z);
    #   代价 = 本次转向自身 lag 的停止滞后残留成航向误差, 终点 = 0.5·sin(lag)。
    # 2026-09-12 现场推翻了原来的"区内整体停摆": bearing +1.88→+3.75→+6.02
    # →+11.22° 全程无人纠, 终点横偏 ~91mm vs dock_tolerance 20mm —— 拿一个
    # ~2° 的不确定度去否决一个 11° 的误差是错的交易。门槛化保留了原论证的
    # 正确部分 (小 bearing 纠不过噪声就别纠), 且 z → dock_distance 时门槛
    # 自动发散, 最后一截仍禁转, 无需硬距离悬崖。
    # 典型门槛 (dock_distance 0.50, lag 2.0): z=1.00→2.0°, 0.75→4.1°,
    # 0.65→6.7°, 0.55→11.1°。**这是区内唯一的现场旋钮**: 调大 = 更保守 =
    # 更早停止区内转向; 调到 ~8° 以上近似恢复旧的整体停摆行为。
    # 注意不要改用 steering_stop_distance 来关这件事 —— 那个参数同时管着
    # 区内"一次连续直行走完剩余距离"与 visible() 的 allow_exit, 动它会把
    # 一次停到位一起关掉。
    dual.straight_yaw_lag_deg: 2.0             # deg — 底盘单步转向停止滞后 (门槛的代价项)
    # 趴下前的单码 (墙码) 粗对准: 双码是精调器不是收敛器 —— 它枚举的单步上限
    # 只有几度, 每步还要停稳-重测 ~2.4s。现场 `二维码已锁定：距离=1.371m` 之后
    # 直接趴下进双码, 锁定时方位差 20.4° 没有任何粗对准, 双码要 ~30 步 ≈ 70s,
    # 顶着 observe_timeout_sec (90s) 走。粗对准在站立姿态下做 (墙码挂墙上,
    # 站着看最清楚; 桩码本来就看不见, 粗对准也不需要它), 只收一个自由度:
    # 墙码 bearing = atan2(横向, 距离) 是直接量测, 不依赖两码基线。
    # 步长同时受 stopgo.max_turn_step 钳制 (保证墙码不转出视野)。
    # 门槛须 >= align_tolerance_deg (启动校验): 粗对准不该去抢精调的活。
    # 预算耗尽不判失败, 只告警移交 —— 收敛与失败判定的责任统一在双码。
    dual.prealign_tolerance_deg: 5.0           # deg — 收进此方位即交给双码
    dual.prealign_step_deg: 8.0                # deg — 单步转向上限
    dual.prealign_max_steps: 12                # x — 步数预算, 耗尽告警后移交双码
    dual.settle_sec: 1.5
    dual.min_frames: 3
    dual.fresh_sec: 0.6
    dual.tf_skew_sec: 0.02
    dual.missing_confirm_sec: 1.5
    dual.missing_timeout_sec: 8.0
    # 闭锁条件 now-qualified_ns ≤ 本值: 末步 ~2.9s + missing_confirm 1.5s + 两码
    # 闪烁, 8s 太紧会错过闭锁窗口 → 12s。
    dual.qualification_sec: 12.0
    # 主账 (脱困 + acquire 找桩码后退): acquire 的"太近"后退现在要从 ~1.37m
    # 开到 1.8m 站位 (0.43m), 与脱困共用 → 0.8m/16 次。
    dual.reverse_limit: 0.8
    dual.reverse_count: 16
    # 站位守卫的独立后退预算 (不与主账共账): 现场起点 1.371m → 1.7m 站位 =
    # 0.33m = 7 步, 3× 裕量。
    dual.standoff_reverse_limit: 1.0           # m — 站位后退累计上限
    dual.standoff_reverse_count: 20            # x — 站位后退步数上限
    dual.acquire_timeout_sec: 60.0
    dual.dock_tolerance: 0.02
    dual.mount_tolerance_deg: 2.0
    dual.stable_position_m: 0.03               # consecutive optical-center displacement limit
    dual.max_actions: 160
    dual.camera_info_topic: "/camera_sync/camera_info"
    dual.projection_mode: "raw"              # explicit: raw K+D or rectified P; remapping does NOT rectify
    dual.min_lateral_m: 0.003
    dual.lateral_tolerance_m: 0.02
    dual.observe_timeout_sec: 120.0
    dual.camera_wait_sec: 5.0
    dual.visibility_margin_px: 8.0
    dual.visibility_sample_pad_px: 2.0
    dual.visibility_samples: 12
    dual.score_improvement: 0.002
    dual.feedback_min_improvement: 0.01
    dual.feedback_fail_windows: 3
    dual.no_candidate_windows: 3
    dual.log_period_sec: 2.0
    dual.odom_fresh_sec: 0.5
    dual.action_timeout_sec: 6.0
    dual.response_timeout_sec: 2.0
    dual.odom_noise_m: 0.001
    dual.odom_noise_rad: 0.002
    # 四足起步姿态瞬态窗: 抬腿换步期间机体会先朝反向晃一下再跟上, 叠加 VIO
    # 高频里程计抖动, 起步 100ms 内零点几度的反向位移是常态。在此窗内不下
    # "反向"判决 (超时/无响应判据不受影响, 它们本就有各自的时间门)。
    # 现场 3° 转向曾在起步 108ms 被判 opposite direction 而中止, 即此瞬态。
    dual.action_startup_sec: 0.6                # s — 起步瞬态宽限, 期间不判反向
    dual.pile_lock_distance: 0.30               # m — pile optical z at which to switch to standing (30cm: any closer and the pile tag leaves the crouched FOV; requires aligned heading first)
    dual.crouch_settle_sec: 3.0                 # s — lie_down settle wait (success + timer; no dedicated posture_state value for crouch)
    dual.posture_retries: 2                     # x — crouch/stand service retries before dual aborts

    # ── Docking Tolerance ──
    tolerance.position_m: 0.05                # m — 前后 ±5cm 视为到位
    tolerance.yaw_deg: 10.0                   # degrees — ±10° 视为对准
    tolerance.stable_time_sec: 1.0            # s — must be stable for this long

    # ── Safety ──
    safety.minimum_distance_m: 0.15           # m — stop if closer than this
    # 静止站立使每个停看点多花 ~1.5-2.5s (锁定+settle+稳定帧+解锁), 一次接近
    # 10-15 停 → +20-40s, 超时相应上调 (120→180); 双码站立流程 (1.8m 站位后退
    # + 1.3m 直行 ≈ 26 步 × ~2.9s) 再上调 (180→300)。
    timeout_sec: 300.0                        # overall docking timeout

    # ── Undock (泊出) ──
    # 泊出 = 盲退一段距离 → 原地转 180°, 纯里程计闭环不看 tag。
    # 由 /docking_node/start_undock 触发, 典型场景: 停泊(DOCKED)后把车退出充电桩/工位。
    # blind 与重试倒车同一路径(negative jog), 转向用 full 全量盲转(里程计校准)。
    undock.backup_distance: 0.8                # m — 盲退距离(后退, 正值)
    undock.linear_rate: 0.2                    # m/s — 后退速率
    undock.turn_angle_deg: 90.0               # deg — 转向角度(正=CCW, 负=CW)
    undock.angular_rate: 0.3                   # rad/s — 转向速率
    undock.timeout_sec: 30.0                   # 泊出整体超时(里程计不走时兜底落 MOTION_FAILED)

    # ── Search Behavior ──
    # 角度步进搜索: 转固定角度(里程计闭环) → 停稳 → 检测 → 再转, 转满 360°。
    # 转动期冻结检测避免误锁; 单向旋转不交替, 12 步(30°)转满一圈在 60s 超时内。
    search.angular_speed: 0.3                 # rad/s — 每步旋转速度
    search.step_angle_deg: 30.0               # deg — 每步旋转角度, 建议≥10°(太小会半速拖慢)
    search.rotate_time_sec: 0.8               # (已弃用) 角度步进化后不再读取, 保留兼容旧配置
    search.pause_time_sec: 3.0                # s — 每步之间的检测停留时长 (检测流有 1.6~3s 空档, 1.5s 会整个错过)
    search.initial_look_sec: 4.0              # s — 搜索第 0 步的停留时长 (开局 RTSP/检测流冷启动, 再多等一会)
    search.hold_time_sec: 0.5                 # s — 二维码持续可见此时长才锁定
    search.search_direction: 1                # +1=CCW, -1=CW (从未见过二维码时的起始方向)
    # 静止站立使每个搜索步 (锁+检测+解锁) 多花 ~1-2.5s, 12 步会远超 60s, 上调到 120。
    search.timeout_sec: 120.0                 # 整体搜索超时

    # ── Per-State Timeouts ──
    align_timeout_sec: 15.0
    approach_timeout_sec: 180.0               # 静止站立每停 +1.5-2.5s, 60→90; 双码 APPROACH 跨 1.8→0.6m (~24 步) 且纠偏全程同钟, 90→180
    final_servo_timeout_sec: 30.0

    # ── Pose Buffer ──
    pose_buffer.size: 30                      # max buffered poses

    # ── Topics ──
    detection_topic: "/detections"
    # 机器狗本体里程计 (l1w_control publish_odom 发布, IMU+运动学航位推算)
    odom_topic: "/dog/odom"
